<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Page - Givezy</title>
    <link rel="stylesheet" href="dona.css">
</head>
<body>
    <header>
        <h1>Givezy</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="donation.html">Donations</a>
            <a href="about.html">About Us</a>
        </nav>
    </header>
    
    <main>
        <section class="login-section">
            <h2>Donor Login</h2>
            <form id="loginForm">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <button id="guestLogin">Continue as Guest</button>
        </section>

        <section id="dashboard" class="hidden">
            <h2>Donor Dashboard</h2>
            <p><strong>Total Donations:</strong> <span id="totalDonations">10</span></p>
            <p><strong>Pending Donations:</strong> <span id="pendingDonations">2</span></p>
            <button id="logout">Logout</button>
        </section>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            document.querySelector('.login-section').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
        });

        document.getElementById('guestLogin').addEventListener('click', function() {
            document.querySelector('.login-section').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
        });

        document.getElementById('logout').addEventListener('click', function() {
            document.getElementById('dashboard').classList.add('hidden');
            document.querySelector('.login-section').classList.remove('hidden');
        });
    </script>
</body>
</html>
